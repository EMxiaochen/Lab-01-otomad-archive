<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>上传 · EM丶小陈的Lab=01音MAD收藏集</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <div class="brand">
        <span class="dot"></span>
        <span class="brand-text">EM丶小陈的</span>
        <span class="lab-badge">Lab=01</span>
        <span class="brand-text">音MAD收藏集</span>
      </div>
      <div class="spacer"></div>
      <button id="themeToggle" class="theme-toggle" title="切换到亮色模式" aria-label="切换主题"></button>
    </nav>
  </header>

  <main class="manage-wrap">
    <section id="authScreen" class="key-screen">
      <h1>管理上传</h1>
      <p>粘贴 GitHub 访问令牌后即可上传，令牌只保存在本浏览器</p>
      <input id="tokenInput" class="key-input" type="password" placeholder="github_pat_…" autocomplete="off" spellcheck="false" />
      <div id="authErr" class="key-err"></div>
      <button id="authBtn" class="btn btn-primary">验证并进入</button>
      <p class="token-help">
        需要一个 Fine-grained token：Repository access 选 <b>Only select repositories</b>，
        权限勾选 <b>Contents: Read and write</b>。
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">去创建</a>
      </p>
    </section>

    <section id="uploadScreen" class="upload-form" style="display:none">
      <div class="form-group">
        <label>视频文件 <span class="req">*</span></label>
        <div id="dropZone" class="drop-zone">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
          <p>点击或拖拽 MP4 文件到这里</p>
          <div id="fileName" class="file-name"></div>
        </div>
        <input id="fileInput" type="file" accept="video/mp4" style="display:none" />
      </div>

      <div class="form-group">
        <label>标题 <span class="req">*</span></label>
        <input id="title" type="text" placeholder="作品标题" />
      </div>
      <div class="form-group">
        <label>作者 <span class="req">*</span></label>
        <input id="author" type="text" placeholder="原作者 / 社团" />
      </div>
      <div class="form-group">
        <label>最早发布日期 <span class="req">*</span></label>
        <input id="publishDate" type="date" />
      </div>
      <div class="form-group">
        <label>原视频链接</label>
        <input id="originalUrl" type="url" placeholder="https://…（仅作元信息，不参与播放）" />
      </div>
      <div class="form-group">
        <label>标签</label>
        <input id="tags" type="text" placeholder="用逗号分隔，如：音MAD,东方" />
      </div>
      <div class="form-group">
        <label>简介</label>
        <textarea id="description" placeholder="可选备注"></textarea>
      </div>

      <div id="progressWrap" class="progress-wrap" style="display:none">
        <div class="progress-bar"><div id="progressFill" class="fill"></div></div>
        <div id="progressText" class="progress-text"></div>
      </div>

      <button id="uploadBtn" class="btn btn-primary">
        <span class="icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 16V4m0 0 4 4m-4-4-4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
        </span>
        <span id="uploadBtnText">上传并发布</span>
      </button>

      <div id="result" class="result-msg" style="display:none"></div>

      <div class="section-head">
        <span>已收录视频（<span id="videoCount">0</span> 条）</span>
        <button id="refreshBtn" class="link-btn">刷新</button>
      </div>
      <div id="videoList" class="video-list"></div>
      <div id="listMsg" class="key-err"></div>

      <p class="token-help">
        当前令牌：<span id="tokenMask"></span>
        <button id="forgetBtn" class="link-btn">清除令牌</button>
        <button id="diagBtn" class="link-btn">运行诊断</button>
      </p>
    </section>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/manage.js"></script>
</body>
</html>
